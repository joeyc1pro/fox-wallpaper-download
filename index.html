<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fox Wallpaper Download</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .preview {
      max-width: 90%;
      width: 600px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #ff3b3b;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #ff1f1f;
      transform: scale(1.05);
    }

    .subtext {
      opacity: 0.7;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Fox Wallpaper</h1>

  <!-- Preview Image -->
  <img 
    src="fox-wallpaper-4k-WITHUSAFLAG.jpg" 
    alt="Fox Wallpaper Preview"
    class="preview"
  />

  <!-- Download Button -->
  <a 
    class="btn"
    href="fox-wallpaper-4k-WITHUSAFLAG.jpg"
    download
  >
    Download Original 4K Wallpaper
  </a>

  <div class="subtext">
    High-resolution 4K wallpaper download
  </div>

</body>
</html>
