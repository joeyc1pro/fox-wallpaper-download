<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fox Wallpaper 4K Download</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --card: rgba(25, 25, 30, 0.72);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.7);
      --accent: #ff3b3b;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow: hidden;
      background: var(--bg);
    }

    /* Dark blurred background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("fox-wallpaper-4k-WITHUSAFLAG.jpg") center/cover no-repeat;
      filter: blur(28px) brightness(0.25) saturate(1.2);
      transform: scale(1.15);
      z-index: -1;
    }

    .card {
      width: 92%;
      max-width: 950px;
      background: var(--card);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      display: flex;
      gap: 30px;
      padding: 28px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.7);
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .preview {
      width: 50%;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .content {
      width: 50%;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: 0.5px;
    }

    p {
      opacity: var(--muted);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.2s ease;
      box-shadow: 0 10px 25px rgba(255,59,59,0.25);
    }

    .btn:hover {
      background: #ff1f1f;
      transform: translateY(-2px) scale(1.05);
    }

    .meta {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.55;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .card {
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }

      .preview, .content {
        width: 100%;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Preview -->
    <img 
      class="preview"
      src="fox-wallpaper-4k-WITHUSAFLAG.jpg"
      alt="Fox Wallpaper Preview"
    />

    <!-- Content -->
    <div class="content">
      <h1>Fox Wallpaper 4K</h1>
      <p>
        High-resolution 4K wallpaper featuring a fox design.
        Optimized for desktop backgrounds, gaming setups, and lock screens.
      </p>

      <a 
        class="btn"
        href="fox-wallpaper-4k-WITHUSAFLAG.jpg"
        download
      >
        Download 4K Wallpaper
      </a>

      <div class="meta">
        fox-wallpaper-4k-WITHUSAFLAG.jpg • 4K Ultra HD
      </div>
    </div>

  </div>

</body>
</html>
